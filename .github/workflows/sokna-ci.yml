name: SOKNA CI

on:
  push:
    branches:
      - main
      - 'phase/**'
      - 'dev/**'
    paths:
      - 'VERSION.txt'
      - '*.php'
      - '*.js'
      - 'admin/**'
      - 'api/**'
      - 'operator/**'
      - 'waiter/**'
      - 'includes/**'
      - 'public_edge/**'
      - 'database/**'
      - 'tools/**'
      - 'modules/**'
      - 'assets/**'
      - 'runtime/**'
      - 'tests/**'
      - 'schema/**'
      - 'scripts/**'
      - 'docs/handoffs/**'
      - 'docs/architecture-migration-r2/**'
      - 'RELEASE_NOTES_*_FA.md'
      - '.github/workflows/sokna-ci.yml'
      - '.gitattributes'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    name: Linux regression gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOKNA_SCREENSHOT_DIR: /tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source is imported
        shell: bash
        run: |
          test -f VERSION.txt
          echo "SOKNA version: $(tr -d '[:space:]' < VERSION.txt)"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, openssl, sodium
          coverage: none

      - name: Setup Chromium for browser gates
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          CHROMIUM="$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")"
          sudo ln -sf "$CHROMIUM" /usr/bin/chromium
          /usr/bin/chromium --version

      - name: Full environment-independent dev gate
        shell: bash
        run: bash tests/run-1360-dev-gate.sh

  windows-phase1:
    name: Windows Phase 1 runtime validation
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source is imported
        shell: pwsh
        run: |
          if (-not (Test-Path VERSION.txt)) { throw 'VERSION.txt is missing' }
          Write-Host "SOKNA version: $((Get-Content VERSION.txt -Raw).Trim())"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_sqlite, openssl, sodium
          coverage: none

      - name: Tool versions
        shell: pwsh
        run: |
          php --version
          node --version
          python --version

      - name: PHP lint
        shell: pwsh
        run: |
          $failed = @()
          $files = Get-ChildItem -Path . -Recurse -File -Filter *.php | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' }
          foreach ($file in $files) {
            php -l $file.FullName | Out-Null
            if ($LASTEXITCODE -ne 0) { $failed += $file.FullName }
          }
          if ($failed.Count -gt 0) { throw "PHP lint failed: $($failed -join ', ')" }
          Write-Host "PHP lint PASS: $($files.Count) files"

      - name: JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem assets -Recurse -File -Filter *.js
          foreach ($file in $files) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "JS syntax failed: $($file.FullName)" }
          }
          node --check service-worker.js
          if ($LASTEXITCODE -ne 0) { throw 'service-worker.js syntax failed' }
          $publicFiles = Get-ChildItem public_edge -Recurse -File -Filter *.js
          foreach ($file in $publicFiles) {
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { throw "Public JS syntax failed: $($file.FullName)" }
          }
          Write-Host "JS syntax PASS: $($files.Count + $publicFiles.Count + 1) files"

      - name: Core unit and Phase 1 contracts
        shell: pwsh
        run: |
          php tests/unit.php
          if ($LASTEXITCODE -ne 0) { throw 'PHP unit checks failed' }
          php tests/phase2-relay-contract.php
          if ($LASTEXITCODE -ne 0) { throw 'Phase 2 relay contract failed' }
          php tests/phase6a-preparation-permissions-contract.php
          if ($LASTEXITCODE -ne 0) { throw 'Phase 6A preparation contract failed' }
          php tests/phase6b-sellable-kind-contract.php
          if ($LASTEXITCODE -ne 0) { throw 'Phase 6B sellable kind contract failed' }
          php tests/phase6c-table-draft-contract.php
          if ($LASTEXITCODE -ne 0) { throw 'Phase 6C Table Draft contract failed' }
          python tests/phase7-runtime-services-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 7 runtime services contract failed' }
          python tests/v1360-ui-language-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'UI language contract failed' }
          python tests/v1360-module-ownership-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Module ownership contract failed' }
          python tests/phase7b-accommodation-transport-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 7B accommodation transport contract failed' }
          python tests/phase7c-center-outbound-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 7C Center outbound contract failed' }
          python tests/phase8a-recovery-identity-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8A recovery identity contract failed' }
          php tests/phase8a-installation-identity-runtime.php
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8A installation identity runtime failed' }
          php tests/phase8a-recovery-metadata-runtime.php
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8A recovery metadata runtime failed' }
          python tests/phase8b-windows-setup-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8B Windows setup contract failed' }
          php tests/phase8b-setup-owner-runtime.php
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8B setup owner runtime failed' }
          python tests/v1360-final-invariants.py
          if ($LASTEXITCODE -ne 0) { throw 'Final invariants failed' }
          python tests/updater-current-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Updater contract failed' }
          python tests/recovery-current-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'Recovery contract failed' }

      - name: Phase 8B Windows setup validate
        shell: pwsh
        run: |
          $php = (Get-Command php).Source
          ./runtime/windows/setup-sokna.ps1 -Mode Validate -PhpExe $php -AppRoot (Resolve-Path .).Path -DataRoot (Join-Path $env:RUNNER_TEMP 'sokna-setup-validate') -SkipHttps -SkipService
          if ($LASTEXITCODE -ne 0) { throw 'Phase 8B Windows setup validate failed' }

      - name: Local Runtime self-check
        shell: pwsh
        run: |
          $env:SOKNA_DATA_DIR = Join-Path $env:RUNNER_TEMP 'sokna-data'
          $env:SOKNA_LOCAL_HOSTNAME = 'sokna.local'
          New-Item -ItemType Directory -Force -Path $env:SOKNA_DATA_DIR | Out-Null
          php runtime/sokna-runtime.php --self-check
          if ($LASTEXITCODE -ne 0) { throw 'Runtime self-check failed' }
          php runtime/sokna-runtime.php --health-json
          if ($LASTEXITCODE -ne 0) { throw 'Runtime health-json failed' }
          php tools/print-runtime-worker.php --once
          if ($LASTEXITCODE -ne 0) { throw 'Print Runtime supervisor self-check failed' }

      - name: Provision and validate sokna.local TLS
        shell: pwsh
        run: |
          $openssl = (Get-Command openssl -ErrorAction SilentlyContinue).Source
          if (-not $openssl) {
            $candidate = 'C:\Program Files\Git\usr\bin\openssl.exe'
            if (Test-Path $candidate) { $openssl = $candidate }
          }
          if (-not $openssl) { throw 'OpenSSL executable not found on Windows runner' }
          $tlsRoot = Join-Path $env:RUNNER_TEMP 'sokna-tls-uat'
          & ./runtime/windows/provision-local-https.ps1 -OpenSslExe $openssl -DataRoot $tlsRoot -Hostname 'sokna.local'
          if ($LASTEXITCODE -ne 0) { throw 'TLS provisioning script failed' }
          $cert = Join-Path $tlsRoot 'secrets\tls\server.crt.pem'
          $key = Join-Path $tlsRoot 'secrets\tls\server.key.pem'
          if (-not (Test-Path $cert)) { throw 'Server certificate was not created' }
          if (-not (Test-Path $key)) { throw 'Server private key was not created' }
          $certText = (& $openssl x509 -in $cert -noout -text | Out-String)
          if ($certText -notmatch 'DNS:sokna\.local') { throw 'sokna.local SAN missing from certificate' }
          $hosts = Get-Content "$env:SystemRoot\System32\drivers\etc\hosts" -Raw
          if ($hosts -notmatch '(?m)^127\.0\.0\.1\s+sokna\.local(?:\s|$)') { throw 'sokna.local hosts mapping missing' }
          Write-Host 'Windows TLS/trust/hosts provisioning PASS'


  phase2-public-integration:
    name: Phase 2 Public Relay HTTP + MariaDB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: sokna_public
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, openssl, sodium
          coverage: none
      - name: Install MariaDB client
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
      - name: Load Public and Local schemas
        shell: bash
        run: |
          mariadb -h127.0.0.1 -P3306 -uroot -proot sokna_public < public_edge/database/schema.sql
          mariadb -h127.0.0.1 -P3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS sokna_local CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          mariadb -h127.0.0.1 -P3306 -uroot -proot sokna_local < database/schema.sql
      - name: Configure Public test instance
        shell: bash
        run: |
          cat > public_edge/config.php <<'PHP'
          <?php
          return [
              'db'=>[
                  'host'=>'127.0.0.1','port'=>'3306','name'=>'sokna_public','user'=>'root','pass'=>'root','charset'=>'utf8mb4',
              ],
              'app'=>[
                  'debug'=>true,
                  'session_ttl_seconds'=>3600,
                  'relay_clock_skew_seconds'=>300,
                  'emergency_key'=>'test-emergency-secret',
              ],
              'installation_secrets'=>[
                  'test-installation'=>'test-relay-secret-01234567890123456789',
              ],
          ];
          PHP
          cat > config.php <<'PHP'
          <?php
          return [
              'db'=>[
                  'host'=>'127.0.0.1','port'=>'3306','name'=>'sokna_local','user'=>'root','pass'=>'root','charset'=>'utf8mb4',
              ],
              'relay'=>[
                  'enabled'=>false,'public_base_url'=>'','installation_id'=>'','shared_secret'=>'','timeout_seconds'=>8,
              ],
              'app'=>[
                  'url'=>'http://127.0.0.1:18081',
                  'key'=>'ci-local-app-key-012345678901234567890123456789',
                  'timezone'=>'Asia/Tehran',
                  'debug'=>true,
                  'trust_proxy_headers'=>false,
                  'data_dir'=>'',
                  'local_hostname'=>'sokna.local',
              ],
          ];
          PHP
      - name: Start Public HTTP edge
        shell: bash
        run: |
          php -S 127.0.0.1:18080 -t public_edge > "${RUNNER_TEMP}/sokna-public.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/sokna-public.pid"
          for i in {1..20}; do
            if curl -sS -o /dev/null http://127.0.0.1:18080/api/v1/auth/login.php; then break; fi
            sleep 1
          done
      - name: Run Public Relay integration
        shell: bash
        env:
          SOKNA_PUBLIC_TEST_URL: http://127.0.0.1:18080
          SOKNA_PUBLIC_TEST_INSTALLATION: test-installation
          SOKNA_PUBLIC_TEST_SECRET: test-relay-secret-01234567890123456789
          SOKNA_PUBLIC_TEST_EMERGENCY: test-emergency-secret
          SOKNA_PUBLIC_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=sokna_public;charset=utf8mb4
          SOKNA_PUBLIC_TEST_DB_USER: root
          SOKNA_PUBLIC_TEST_DB_PASS: root
        run: |
          php tests/phase2-public-http.php
          php tests/phase3-guest-publish-http.php
          php tests/phase3-guest-realtime-http.php
          php tests/phase4-remote-read-http.php
          php tests/phase5-deferred-http.php
          php tests/phase5-deferred-local.php
          php tests/phase6a-preparation-local.php
          php tests/phase6b-sellable-kind-local.php
          php tests/phase6c-table-draft-http.php
          php tests/phase6c-table-draft-local.php
          php tests/phase7c-center-projection-local.php
          php tests/phase8b-machine-recovery-local.php
      - name: Public edge log on failure
        if: failure()
        shell: bash
        run: cat "${RUNNER_TEMP}/sokna-public.log" || true
