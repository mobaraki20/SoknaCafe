services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: cafe_qr
      MARIADB_USER: cafe
      MARIADB_PASSWORD: cafe_dev_password
      MARIADB_ROOT_PASSWORD: root_dev_password
    ports:
      - "3307:3306"
    volumes:
      - cafe_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cafe_db:
